name: Release Linux (deb + rpm)

# Workflow riêng cho Linux. Không gộp chung với Windows (release.yml) vì
# mỗi nền tảng có thể có version riêng và môi trường build khác nhau.
on:
  push:
    tags:
      - 'linux-v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb + .tar.gz (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Cache & Install APT packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: cmake g++ clang zlib1g-dev libkrb5-dev libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev dpkg-dev
          version: 1.0

      - name: Build and package .deb + .tar.gz
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/linux/package_linux.sh
          echo "--- Artifacts ---"
          ls -la delivery/linux

      - name: Upload .deb + .tar.gz
        uses: softprops/action-gh-release@v2
        with:
          files: |
            delivery/linux/*.deb
            delivery/linux/*.tar.gz
          body_path: delivery/commit-message/1.1.5.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rpm:
    name: Build .rpm (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake gcc-c++ clang \
            zlib-devel krb5-devel openssl-devel \
            libicu \
            fcitx5-devel rpm-build \
            git curl tar ca-certificates

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Build and package .rpm
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/linux/package_linux.sh
          # Gom file .rpm về delivery/linux/ cho dễ upload.
          find delivery/linux/rpmbuild/RPMS -name '*.rpm' -exec cp {} delivery/linux/ \;
          echo "--- Artifacts ---"
          ls -la delivery/linux

      - name: Upload .rpm
        uses: softprops/action-gh-release@v2
        with:
          files: |
            delivery/linux/*.rpm
          body_path: delivery/commit-message/1.1.5.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
