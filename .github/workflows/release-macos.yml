name: Release macOS

# Workflow tự động build và đóng gói bản phát hành macOS (M7).
# Tương tự như release.yml (Windows) và release-linux.yml (Linux).
on:
  workflow_dispatch:
  push:
    tags:
      - 'macos-v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Package macOS
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/macos/*.sh
          bash scripts/macos/package_macos.sh arm64
          echo "--- Artifacts in delivery/macos ---"
          ls -la delivery/macos

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BambooMintKey-macos-arm64
          path: delivery/macos/*

      - name: Upload macOS Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            delivery/macos/*.dmg
            delivery/macos/*.pkg
            delivery/macos/*.zip
            delivery/macos/*.tar.gz
          body_path: delivery/commit-message/1.1.5.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
