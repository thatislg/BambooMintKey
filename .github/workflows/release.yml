name: Release & Code Signing Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-sign:
    name: Build, Sign and Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python (for icon generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow and Generate Icon
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          python scripts/generate-icon.py

      - name: Run Core Test Suite
        run: |
          dotnet test tests/BambooMintKey.Core.Tests/BambooMintKey.Core.Tests.fsproj -c Release

      - name: Build NativeAOT TSF Bridge
        shell: pwsh
        run: |
          .\scripts\build-native.ps1 -Configuration Release -Runtime win-x64

      - name: Publish GUI Configuration Tool
        run: |
          dotnet publish src\BambooMintKey.UI\BambooMintKey.UI.fsproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish\ui

      - name: Locate SignTool
        id: signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending |
                      Select-Object -First 1
          if (-not $signtool) {
            Write-Error "SignTool.exe not found. Ensure Windows SDK is installed on the runner."
            exit 1
          }
          echo "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "SignTool: $($signtool.FullName)"

      - name: Decode Code Signing Certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:CERT_BASE64)) {
            [System.IO.File]::WriteAllBytes("cert.pfx", [System.Convert]::FromBase64String($env:CERT_BASE64))
            Write-Host "Code signing certificate decoded."
          } else {
            Write-Host "Warning: No Code Signing Certificate found in secrets. Skipping signing."
          }

      - name: Sign Inner Binaries
        shell: pwsh
        env:
          CERT_PASS: ${{ secrets.CODE_SIGN_CERT_PASS }}
          SIGNTOOL: ${{ steps.signtool.outputs.SIGNTOOL_PATH }}
        run: |
          if (Test-Path "cert.pfx") {
            & $env:SIGNTOOL sign `
              /f cert.pfx `
              /p $env:CERT_PASS `
              /tr http://timestamp.digicert.com `
              /td sha256 `
              /fd sha256 `
              publish\win-x64\BambooMintKey.dll `
              publish\ui\BambooMintKey.UI.exe
          } else {
            Write-Host "No certificate available; skipping inner binary signing."
          }

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler (ISCC.exe) not found on the runner."
            exit 1
          }
          & $iscc delivery\installer\installer.iss

      - name: Sign Final Installer
        shell: pwsh
        env:
          CERT_PASS: ${{ secrets.CODE_SIGN_CERT_PASS }}
          SIGNTOOL: ${{ steps.signtool.outputs.SIGNTOOL_PATH }}
        run: |
          if (Test-Path "cert.pfx") {
            & $env:SIGNTOOL sign `
              /f cert.pfx `
              /p $env:CERT_PASS `
              /tr http://timestamp.digicert.com `
              /td sha256 `
              /fd sha256 `
              bin\dist\BambooMintKey-Setup.exe
          } else {
            Write-Host "No certificate available; skipping installer signing."
          }

      - name: Calculate Checksum (SHA-256)
        id: compute_hash
        shell: pwsh
        run: |
          $target = "bin\dist\BambooMintKey-Setup.exe"
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash
          Set-Content -Path "bin\dist\BambooMintKey-Setup.exe.sha256" -Value "$hash  BambooMintKey-Setup.exe"
          echo "INSTALLER_SHA256=$hash" >> $env:GITHUB_OUTPUT
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BambooMintKey-Setup.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Generated SHA256: $hash"

      - name: Update Local WinGet Manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BambooMintKey-Setup.exe"
          .\scripts\update-winget-manifest.ps1 `
            -Version $version `
            -InstallerUrl $url `
            -InstallerSha256 "${{ steps.compute_hash.outputs.INSTALLER_SHA256 }}"

      - name: Commit Updated WinGet Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update winget manifest for ${{ github.ref_name }}"
          file_pattern: "manifests/**/*.yaml"

      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/dist/BambooMintKey-Setup.exe
            bin/dist/BambooMintKey-Setup.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Code Signing Certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "cert.pfx") {
            Remove-Item "cert.pfx" -Force
            Write-Host "Removed cert.pfx"
          }

  winget-submission:
    name: Submit Manifest to WinGet
    needs: build-and-sign
    runs-on: ubuntu-latest
    steps:
      - name: Install Komac
        run: |
          python -m pip install --upgrade pip
          pip install komac

      - name: Update and Submit WinGet Manifest
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_PAT_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BambooMintKey-Setup.exe"
          echo "Updating WinGet manifest for version $version from $url"
          komac update BambooMintKey.BambooMintKey --version "$version" --urls "$url" --token "$WINGET_TOKEN" --submit
